name: Daily Snapshot

on:
  schedule:
    - cron: '0 9 * * 1-5'   # 09:00 UTC Mon–Fri (adjust to taste)
  workflow_dispatch:          # manual trigger from the Actions tab

jobs:
  load-docs:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: echo "value=$(jq -c '[.[] | {id:.id, title:.title}]' docs.json)" >> $GITHUB_OUTPUT

  snapshot:
    needs: load-docs
    runs-on: ubuntu-latest
    name: "${{ matrix.doc.title }}"
    strategy:
      matrix:
        doc: ${{ fromJson(needs.load-docs.outputs.matrix) }}
      fail-fast: false   # one doc failing does not cancel the others
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SNAPSHOTS_GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install lucid-history
        run: npm install github:lhamoudi/lucid-history

      - name: Configure git identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Run snapshot
        env:
          LUCID_API_KEY: ${{ secrets.LUCID_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.SNAPSHOTS_GITHUB_TOKEN }}
          LUCID_FOLDER_ID: ${{ vars.LUCID_FOLDER_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CONFLUENCE_TOKEN: ${{ secrets.CONFLUENCE_TOKEN }}
          CONFLUENCE_URL: ${{ vars.CONFLUENCE_URL }}
          CONFLUENCE_EMAIL: ${{ vars.CONFLUENCE_EMAIL }}
          CONFLUENCE_SPACE: ${{ vars.CONFLUENCE_SPACE }}
          CONFLUENCE_PARENT_ID: ${{ vars.CONFLUENCE_PARENT_ID }}
        run: |
          FOLDER_FLAG=""
          [ -n "$LUCID_FOLDER_ID" ] && FOLDER_FLAG="--lucid-folder $LUCID_FOLDER_ID"
          SLACK_FLAG=""
          [ -n "$SLACK_WEBHOOK_URL" ] && SLACK_FLAG="--slack-webhook $SLACK_WEBHOOK_URL"
          CONFLUENCE_FLAGS=""
          if [ -n "$CONFLUENCE_TOKEN" ] && [ -n "$CONFLUENCE_PARENT_ID" ]; then
            CONFLUENCE_FLAGS="--confluence-url $CONFLUENCE_URL --confluence-email $CONFLUENCE_EMAIL --confluence-token $CONFLUENCE_TOKEN --confluence-space $CONFLUENCE_SPACE --confluence-parent $CONFLUENCE_PARENT_ID"
          fi
          npx lucid-history snapshot "${{ matrix.doc.id }}" \
            --repo "${{ github.repository }}" \
            $FOLDER_FLAG \
            $SLACK_FLAG \
            $CONFLUENCE_FLAGS

  update-confluence:
    needs: snapshot
    if: always()   # run even if some snapshot jobs failed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SNAPSHOTS_GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install lucid-history
        run: npm install github:lhamoudi/lucid-history

      - name: Configure git identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Update Confluence
        env:
          CONFLUENCE_TOKEN: ${{ secrets.CONFLUENCE_TOKEN }}
          CONFLUENCE_URL: ${{ vars.CONFLUENCE_URL }}
          CONFLUENCE_EMAIL: ${{ vars.CONFLUENCE_EMAIL }}
          CONFLUENCE_SPACE: ${{ vars.CONFLUENCE_SPACE }}
          CONFLUENCE_PARENT_ID: ${{ vars.CONFLUENCE_PARENT_ID }}
        run: |
          if [ -z "$CONFLUENCE_TOKEN" ] || [ -z "$CONFLUENCE_PARENT_ID" ]; then
            echo "CONFLUENCE_TOKEN or CONFLUENCE_PARENT_ID not set — skipping"
            exit 0
          fi
          git pull origin main
          npx lucid-history confluence-update \
            --local . \
            --repo "${{ github.repository }}" \
            --confluence-url "$CONFLUENCE_URL" \
            --confluence-email "$CONFLUENCE_EMAIL" \
            --confluence-token "$CONFLUENCE_TOKEN" \
            --confluence-space "$CONFLUENCE_SPACE" \
            --confluence-parent "$CONFLUENCE_PARENT_ID"
